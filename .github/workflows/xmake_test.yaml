on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  run_unit_test_xmake:
    name: Run unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14, macos-13]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build xgrammar from source
        run: |
          xmake f --XGRAMMAR_BUILD_CXX_TESTS=yes --XGRAMMAR_BUILD_PYTHON_BINDINGS=yes -y && xmake -y

      - name: Run C++ tests
        run: |
          xmake run test
